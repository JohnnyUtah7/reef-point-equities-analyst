name: Research output checks
on: [push, pull_request]
jobs:
  output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_terminal_model.js
      - run: node --experimental-strip-types edgar-mcp/test/protocol.test.ts
      - run: python scripts/build_research_site.py examples/research-site-v2.json
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-site-browser-check
          path: |
            browser-artifacts/
            examples/docs/demo-reef-point-live.html
